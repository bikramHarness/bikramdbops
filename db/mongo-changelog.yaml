databaseChangeLog:
  - changeSet:
      id: user:8
      author: user@harness.io
      context: example-context
      labels: create-collection, base-setup
      comment: |
        Creating a new collection 'mg1' to store user address information.
        Includes fields: id, name, address1, address2, and city.
      changes:
        - createCollection:
            collectionName: mg1
      rollback:
        - dropCollection:
            collectionName: mg1
  - changeSet:
      id: user:9
      author: user@harness.io
      context: example-context
      labels: add-collection
      comment: Create a new collection 'mg2'
      changes:
        - createCollection:
            collectionName: mg2
      rollback:
        - dropCollection:
            collectionName: mg2
  - changeSet:
      id: user:10
      author: user@harness.io
      context: example-context
      labels: dynamic-collections
      changes:
        - createCollection:
            collectionName: mg3
      rollback:
        - dropCollection:
            collectionName: mg3
  - changeSet:
      id: create-products-collection
      author: harness-ai
      comment: Create a simple products collection with a unique index on product_code
      labels: ""
      changes:
        - createCollection:
            collectionName: products
      rollback:
        - dropCollection:
            collectionName: products
  - changeSet:
      id: create-index-products-product-code
      author: harness-ai
      comment: Add unique index on product_code field in the products collection
      labels: ""
      changes:
        - createIndex:
            collectionName: products
            keys: '{"product_code": 1}'
            options: '{"name": "idx_products_product_code", "unique": true}'
      rollback:
        - dropIndex:
            collectionName: products
            indexName: idx_products_product_code
